openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Model Orchestrator & Source Harvester API
servers:
  - url: /api
    description: Base API path
tags:
  - name: gemini
    description: Gemini AI chat and image operations
  - name: health
    description: Health operations
  - name: models
    description: Model registry operations
  - name: runs
    description: Harvest run operations
  - name: harvest
    description: Harvest pipeline control
  - name: router
    description: Smart model selection
  - name: stats
    description: Dashboard statistics
  - name: trader-account
    description: Paper trading account state
  - name: trader-settings
    description: Trader configuration and risk profile
  - name: trader-snapshot
    description: Live market snapshot from data source
  - name: trader-signals
    description: Trading signal generation, audit, approval
  - name: trader-positions
    description: Open and closed paper positions
  - name: trader-cycle
    description: Trader decision cycle control
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: List models in the registry
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, SLOW, FAIL, ARCHIVED, ALL]
            default: ALL
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [chat, embedding, completion, image, audio, unknown, ALL]
            default: ALL
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [score, latency, tps, lastChecked]
            default: score
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Models list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"

  /models/top:
    get:
      operationId: getTopModels
      tags: [models]
      summary: Top K models by score
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [chat, embedding, completion, image, audio, unknown, ALL]
            default: ALL
      responses:
        "200":
          description: Top models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"

  /models/active:
    get:
      operationId: getActiveModels
      tags: [models]
      summary: All currently active models
      responses:
        "200":
          description: Active models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"

  /models/{id}:
    get:
      operationId: getModel
      tags: [models]
      summary: Model details with performance history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /runs:
    get:
      operationId: listRuns
      tags: [runs]
      summary: Harvest run history
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Runs list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HarvestRun"

  /runs/latest:
    get:
      operationId: getLatestRun
      tags: [runs]
      summary: Latest harvest run summary
      responses:
        "200":
          description: Latest run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarvestRun"

  /harvest/run:
    post:
      operationId: triggerHarvest
      tags: [harvest]
      summary: Manually trigger a harvest cycle
      responses:
        "202":
          description: Accepted, run started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarvestStartResponse"
        "409":
          description: A run is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /harvest/status:
    get:
      operationId: getHarvestStatus
      tags: [harvest]
      summary: Current harvest pipeline status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarvestStatus"

  /route:
    post:
      operationId: routeRequest
      tags: [router]
      summary: Select the best active model for a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: Selected model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"
        "404":
          description: No active model available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Dashboard summary statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"


  /trader/account:
    get:
      operationId: getTraderAccount
      tags: [trader-account]
      summary: Paper trading account state
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderAccount"

  /trader/account/reset:
    post:
      operationId: resetTraderAccount
      tags: [trader-account]
      summary: Reset paper account to a starting balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetAccountBody"
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderAccount"

  /trader/settings:
    get:
      operationId: getTraderSettings
      tags: [trader-settings]
      summary: Trader settings (risk profile, mode, execution)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderSettings"
    patch:
      operationId: updateTraderSettings
      tags: [trader-settings]
      summary: Update trader settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTraderSettingsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderSettings"

  /trader/snapshot:
    get:
      operationId: getTraderSnapshot
      tags: [trader-snapshot]
      summary: Current XAU/USD market snapshot from source
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderSnapshot"
        "503":
          description: Data source unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /trader/signals:
    get:
      operationId: listTraderSignals
      tags: [trader-signals]
      summary: List signals (most recent first)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, EXECUTED, EXPIRED, ALL]
            default: ALL
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TraderSignal"

  /trader/signals/{id}:
    get:
      operationId: getTraderSignal
      tags: [trader-signals]
      summary: Signal with full audit trail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderSignalDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /trader/signals/{id}/approve:
    post:
      operationId: approveTraderSignal
      tags: [trader-signals]
      summary: Approve a pending signal (manual mode)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved and executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderSignalDetail"
        "409":
          description: Cannot approve in current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /trader/signals/{id}/reject:
    post:
      operationId: rejectTraderSignal
      tags: [trader-signals]
      summary: Reject a pending signal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectSignalRequest"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderSignal"

  /trader/positions:
    get:
      operationId: listTraderPositions
      tags: [trader-positions]
      summary: Open and closed paper positions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, CLOSED, ALL]
            default: ALL
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TraderPosition"

  /trader/positions/{id}/close:
    post:
      operationId: closeTraderPosition
      tags: [trader-positions]
      summary: Manually close an open position at current market price
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderPosition"
        "409":
          description: Position not open
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /trader/cycle/run:
    post:
      operationId: runTraderCycle
      tags: [trader-cycle]
      summary: Manually trigger one decision cycle now
      responses:
        "200":
          description: Cycle ran
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CycleRunResult"

  /trader/decision:
    get:
      operationId: getTraderDecision
      tags: [trader-cycle]
      summary: Run multi-agent consensus engine (dry-run, no trade committed)
      responses:
        "200":
          description: Consensus verdict from all 6 agents + anti-hallucination guard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsensusVerdict"
        "503":
          description: Decision engine failed (source unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"

  /trader/ingest/frame:
    post:
      operationId: ingestTraderFrame
      tags: [trader-cycle]
      summary: Ingest a Bookmap/heatmap frame for the Vision Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrameIngestRequest"
      responses:
        "200":
          description: Frame ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestFrameResult"

  /trader/dashboard:
    get:
      operationId: getTraderDashboard
      tags: [trader-account]
      summary: Aggregated dashboard payload (account + open positions + recent signals + last cycle)
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderDashboard"

  /gemini/conversations:
    get:
      operationId: listGeminiConversations
      tags: [gemini]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiConversation"
    post:
      operationId: createGeminiConversation
      tags: [gemini]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGeminiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversation"
  /gemini/conversations/{id}:
    get:
      operationId: getGeminiConversation
      tags: [gemini]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
    delete:
      operationId: deleteGeminiConversation
      tags: [gemini]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
  /gold/price:
    get:
      operationId: getGoldPrice
      tags: [gold]
      summary: Latest bid/ask/mid/spread from gold platform
      responses:
        "200":
          description: Current price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldPrice"
  /gold/ticks:
    get:
      operationId: getGoldTicks
      tags: [gold]
      summary: Recent tick buffer
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Array of recent ticks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoldTick"
  /gold/orderbook:
    get:
      operationId: getGoldOrderBook
      tags: [gold]
      summary: Current order book depth
      responses:
        "200":
          description: Order book bids and asks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldOrderBook"
  /gold/summary:
    get:
      operationId: getGoldSummary
      tags: [gold]
      summary: dominantFlow, liquidityState, institutionalScore
      responses:
        "200":
          description: Market summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldSummary"
  /gold/orderflow:
    get:
      operationId: getGoldOrderFlow
      tags: [gold]
      summary: Delta, cumulativeDelta, absorption, exhaustion
      responses:
        "200":
          description: Order flow metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldOrderFlow"
  /gold/liquidity/zones:
    get:
      operationId: getGoldLiquidityZones
      tags: [gold]
      summary: Stop clusters, liquidity pools, trap zones
      responses:
        "200":
          description: Liquidity zones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoldLiquidityZone"
  /gold/status:
    get:
      operationId: getGoldStatus
      tags: [gold]
      summary: Platform connection status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldStatus"
  /trader/sweep:
    get:
      operationId: getTraderSweep
      tags: [trader-cycle]
      summary: Liquidity Trap Detector v2 — dry-run sweep assessment for current market
      parameters:
        - name: direction
          in: query
          required: false
          schema:
            type: string
            enum: [BUY, SELL]
          description: "Signal direction to assess; defaults to current source signal direction"
      responses:
        "200":
          description: Sweep assessment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SweepAssessment"
        "400":
          description: No directional signal available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorBody"
  /gold/snapshot:
    get:
      operationId: getGoldSnapshot
      tags: [gold]
      summary: Full snapshot — all gold data at once
      responses:
        "200":
          description: Complete gold platform snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldSnapshot"
  /gemini/conversations/{id}/messages:
    get:
      operationId: listGeminiMessages
      tags: [gemini]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiMessage"
    post:
      operationId: sendGeminiMessage
      tags: [gemini]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendGeminiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    Model:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
        endpoint:
          type: string
        type:
          type: string
          enum: [chat, embedding, completion, image, audio, unknown]
        latencyMs:
          type: number
          nullable: true
        tps:
          type: number
          nullable: true
        successRate:
          type: number
          nullable: true
        quality:
          type: number
          nullable: true
        score:
          type: number
        status:
          type: string
          enum: [ACTIVE, SLOW, FAIL, ARCHIVED]
        rank:
          type: integer
          nullable: true
        lastChecked:
          type: string
          format: date-time
          nullable: true
        sourceUrl:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
      required:
        - id
        - name
        - provider
        - endpoint
        - type
        - score
        - status

    ModelListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Model"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required:
        - items
        - total
        - limit
        - offset

    ModelHistoryPoint:
      type: object
      properties:
        runId:
          type: string
        timestamp:
          type: string
          format: date-time
        latencyMs:
          type: number
          nullable: true
        tps:
          type: number
          nullable: true
        score:
          type: number
        status:
          type: string
      required:
        - runId
        - timestamp
        - score
        - status

    ModelDetail:
      allOf:
        - $ref: "#/components/schemas/Model"
        - type: object
          properties:
            history:
              type: array
              items:
                $ref: "#/components/schemas/ModelHistoryPoint"
          required:
            - history

    HarvestRun:
      type: object
      properties:
        id:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [RUNNING, SUCCESS, FAILED]
        sourceCommit:
          type: string
          nullable: true
        linksDiscovered:
          type: integer
        linksTested:
          type: integer
        modelsActive:
          type: integer
        modelsFailed:
          type: integer
        avgLatencyMs:
          type: number
          nullable: true
        avgScore:
          type: number
          nullable: true
        durationMs:
          type: integer
          nullable: true
        message:
          type: string
          nullable: true
      required:
        - id
        - startedAt
        - status
        - linksDiscovered
        - linksTested
        - modelsActive
        - modelsFailed

    HarvestStartResponse:
      type: object
      properties:
        runId:
          type: string
        startedAt:
          type: string
          format: date-time
        message:
          type: string
      required:
        - runId
        - startedAt
        - message

    HarvestStatus:
      type: object
      properties:
        running:
          type: boolean
        currentRunId:
          type: string
          nullable: true
        stage:
          type: string
          nullable: true
        progress:
          type: number
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        lastFinishedAt:
          type: string
          format: date-time
          nullable: true
        nextScheduledAt:
          type: string
          format: date-time
          nullable: true
      required:
        - running

    RouteRequest:
      type: object
      properties:
        taskType:
          type: string
          enum: [realtime, analysis, balanced, embedding]
        modelType:
          type: string
          enum: [chat, embedding, completion, image, audio, ALL]
          default: chat
        excludeIds:
          type: array
          items:
            type: string
      required:
        - taskType

    RouteResponse:
      type: object
      properties:
        taskType:
          type: string
        selected:
          $ref: "#/components/schemas/Model"
        fallbacks:
          type: array
          items:
            $ref: "#/components/schemas/Model"
        reason:
          type: string
      required:
        - taskType
        - selected
        - fallbacks
        - reason

    Stats:
      type: object
      properties:
        totalModels:
          type: integer
        activeModels:
          type: integer
        slowModels:
          type: integer
        failedModels:
          type: integer
        archivedModels:
          type: integer
        avgScore:
          type: number
          nullable: true
        avgLatencyMs:
          type: number
          nullable: true
        avgTps:
          type: number
          nullable: true
        lastRunAt:
          type: string
          format: date-time
          nullable: true
        lastRunStatus:
          type: string
          nullable: true
        nextRunAt:
          type: string
          format: date-time
          nullable: true
        typeBreakdown:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              count:
                type: integer
            required:
              - type
              - count
      required:
        - totalModels
        - activeModels
        - slowModels
        - failedModels
        - archivedModels
        - typeBreakdown
    ErrorBody:
      type: object
      properties:
